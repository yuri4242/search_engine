# LLM + HyDE 設定
# モデルパスは Step 2 のモデル比較結果で確定する

llm:
  model_path: models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf  # 暫定
  n_ctx: 512
  n_threads: 8
  max_tokens: 200
  temperature: 0.7

hyde:
  prompt_template: |
    以下の検索クエリに対して、Qiitaの技術記事に書いてありそうな回答を100〜200文字で書いてください。
    正確さよりも、関連する技術用語や表現を含むことが重要です。

    クエリ: {query}
    回答:
