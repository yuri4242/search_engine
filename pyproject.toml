[project]
name = "search-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "sudachipy",
    "sudachidict-core",
    "rank-bm25",
    "lancedb",
    "transformers>=4.57,<5.0",
    "sentence-transformers>=4.1,<5.0",
    "sentencepiece",
    "fugashi",
    "unidic-lite",
    "llama-cpp-python>=0.3.20",
    "psutil>=7.2.2",
    "langchain==0.3.7",
    "langchain-community==0.3.7",
    "langchain-huggingface>=0.1,<0.2",
    "langchain-core>=0.3.15,<0.4",
    "ragatouille>=0.0.9.post2",
    "datasets>=2.20",
    "ninja>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
