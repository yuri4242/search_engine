[project]
name = "search-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "sudachipy",
    "sudachidict-core",
    "rank-bm25",
    "lancedb",
    "transformers>=4.57,<5.0",
    "sentence-transformers>=4.1,<5.0",
    "sentencepiece",
    "fugashi",
    "unidic-lite",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
