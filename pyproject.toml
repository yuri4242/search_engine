[project]
name = "search-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "sudachipy",
    "sudachidict-core",
    "rank-bm25",
    "lancedb",
    "transformers>=4.57,<5.0",
    "sentence-transformers>=4.1,<5.0",
    "sentencepiece",
    "fugashi",
    "unidic-lite",
    "llama-cpp-python>=0.3.20",
    "psutil>=7.2.2",
    "langchain>=1.2.16",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
